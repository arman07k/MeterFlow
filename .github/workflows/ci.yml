name: MeterFlow CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: meterflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, Modulith, Security & Testcontainers Verify (Java 25)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Eclipse Temurin JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Validate compose.yaml syntax
        run: docker compose config -q

      - name: Run Maven unit, Modulith, Security, and Testcontainers PostgreSQL verification
        run: chmod +x mvnw && ./mvnw -B verify

      - name: Publish test reports on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maven-test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          if-no-files-found: ignore
