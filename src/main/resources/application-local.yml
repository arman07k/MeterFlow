spring:
  datasource:
    url: ${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/meterflow}?reWriteBatchedInserts=true
    username: ${POSTGRES_USER:meterflow}
    password: ${POSTGRES_PASSWORD:meterflow_local_dev_only}
    hikari:
      pool-name: meterflow-local-pool
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
  thymeleaf:
    cache: false

meterflow:
  batch:
    concurrency-limit: 4
  webhooks:
    allow-local-targets: true
