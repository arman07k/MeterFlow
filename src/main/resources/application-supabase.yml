spring:
  datasource:
    # Flyway requires Direct or Supavisor Session Mode (port 5432) for PostgreSQL advisory locks.
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME}
    password: ${SUPABASE_DB_PASSWORD}
    hikari:
      pool-name: meterflow-supabase-pool
      maximum-pool-size: 6
      minimum-idle: 2
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 15000
  flyway:
    # Supabase's default "public" schema is non-empty; baseline at version 0 so V1..V8 all execute cleanly.
    baseline-on-migrate: true
    baseline-version: "0"

meterflow:
  batch:
    # Keep batch concurrency single-threaded on shared Supabase free-tier connection quotas (ADR-002, ADR-005).
    concurrency-limit: 1
