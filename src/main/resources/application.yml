spring:
  application:
    name: meterflow
  threads:
    virtual:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  modulith:
    events:
      completion-mode: UPDATE
      republish-outstanding-events-on-restart: true
      externalization:
        enabled: false
    moments:
      enabled: false
  thymeleaf:
    cache: true

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: meterflow

info:
  app:
    name: MeterFlow
    description: Usage-Based Metering, Subscription Rating, Invoicing, Dunning, and Webhook Platform
    version: 0.1.0-SNAPSHOT

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  paths-to-match: /api/v1/**

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%thread] [%X{correlationId:-none}] %logger{36} - %msg%n"

meterflow:
  scheduling:
    enabled: true
  security:
    bootstrap:
      enabled: false
  batch:
    concurrency-limit: 2
  outbox:
    retry-fixed-delay-ms: 15000
    retry-min-age-seconds: 10
