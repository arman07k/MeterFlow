<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Notifications')}"></head>
<body>
<header th:replace="~{fragments/layout :: customerNav('notifications', ${customer}, ${unreadCount})}"></header>
<main class="container">
    <div th:replace="~{fragments/layout :: flashMessages}"></div>
    <div class="page-header">
        <div>
            <h1>Notifications</h1>
            <p class="subtitle">Billing, payment, dunning, and usage threshold alerts persisted for your account.</p>
        </div>
        <div class="actions-row">
            <a class="btn btn-secondary btn-sm" th:href="@{/customer/notifications(customerId=${customer.id})}">All</a>
            <a class="btn btn-secondary btn-sm" th:href="@{/customer/notifications(customerId=${customer.id},unreadOnly=true)}">Unread Only</a>
            <form th:if="${unreadCount > 0}" th:action="@{/customer/notifications/read-all}" method="post" class="inline-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="customerId" th:value="${customer.id}"/>
                <button type="submit" class="btn btn-sm">Mark All Read</button>
            </form>
        </div>
    </div>

    <div class="card">
        <div th:if="${notificationsPage.isEmpty()}" class="empty-state">No notifications found.</div>
        <div th:unless="${notificationsPage.isEmpty()}" class="table-wrap">
            <table>
                <thead><tr><th>Type</th><th>Title</th><th>Message</th><th>Created</th><th>Action</th></tr></thead>
                <tbody>
                <tr th:each="n : ${notificationsPage.content}">
                    <td><span class="badge" th:classappend="${n.read} ? '' : 'badge-warn'" th:text="${n.type}">INFO</span></td>
                    <td th:text="${n.title}">Title</td>
                    <td th:text="${n.message}">Message</td>
                    <td class="mono" th:text="${n.createdAt}">ts</td>
                    <td>
                        <span th:if="${n.read}" class="badge badge-success">Read</span>
                        <form th:unless="${n.read}" th:action="@{/customer/notifications/{id}/read(id=${n.id})}" method="post" class="inline-form">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" name="customerId" th:value="${customer.id}"/>
                            <button type="submit" class="btn btn-secondary btn-sm">Mark Read</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="pagination" th:if="${notificationsPage.totalPages > 1}">
                <span th:text="'Page ' + (${notificationsPage.number} + 1) + ' of ' + ${notificationsPage.totalPages} + ' (' + ${notificationsPage.totalElements} + ' total)'"></span>
                <div class="actions-row">
                    <a th:if="${notificationsPage.hasPrevious()}" class="btn btn-secondary btn-sm"
                       th:href="@{/customer/notifications(customerId=${customer.id},unreadOnly=${unreadOnly},page=${notificationsPage.number - 1})}">Previous</a>
                    <a th:if="${notificationsPage.hasNext()}" class="btn btn-secondary btn-sm"
                       th:href="@{/customer/notifications(customerId=${customer.id},unreadOnly=${unreadOnly},page=${notificationsPage.number + 1})}">Next</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
