<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Webhook Delivery Detail')}"></head>
<body>
<header th:replace="~{fragments/layout :: customerNav('webhooks', ${customer}, ${unreadCount})}"></header>
<main class="container">
    <div th:replace="~{fragments/layout :: flashMessages}"></div>
    <div class="page-header">
        <div>
            <h1>Webhook Delivery Detail</h1>
            <p class="subtitle">
                Event: <span class="mono" th:text="${deliveryDetail.summary.eventType}">event</span>
                &middot; Status: <span class="badge badge-info" th:text="${deliveryDetail.summary.status}">DELIVERED</span>
            </p>
        </div>
        <div class="actions-row">
            <a class="btn btn-secondary" th:href="@{/customer/webhooks(customerId=${customer.id})}">Back to Webhooks</a>
            <form th:action="@{/customer/webhooks/deliveries/{id}/replay(id=${deliveryDetail.summary.id})}" method="post" class="inline-form">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="customerId" th:value="${customer.id}"/>
                <button type="submit" class="btn">Manual Replay (Fresh Signature)</button>
            </form>
        </div>
    </div>

    <div class="card">
        <h2>Payload Envelope</h2>
        <pre class="pre-json" th:text="${deliveryDetail.payloadJson}">{}</pre>
    </div>

    <div class="card">
        <h2>Immutable Delivery Attempt History</h2>
        <div th:if="${#lists.isEmpty(deliveryDetail.attempts)}" class="empty-state">No delivery attempts executed yet.</div>
        <div th:unless="${#lists.isEmpty(deliveryDetail.attempts)}" class="table-wrap">
            <table>
                <thead><tr><th>#</th><th>Mode</th><th>HTTP Status</th><th>Duration (ms)</th><th>Signature Timestamp</th><th>Error / Excerpt</th><th>Attempted At</th></tr></thead>
                <tbody>
                <tr th:each="a : ${deliveryDetail.attempts}">
                    <td th:text="${a.attemptNumber}">1</td>
                    <td><span class="badge" th:classappend="${a.manualReplay} ? 'badge-warn' : 'badge-info'" th:text="${a.manualReplay ? 'MANUAL REPLAY' : 'AUTO'}">AUTO</span></td>
                    <td th:text="${a.httpStatus != null ? a.httpStatus : 'ERR'}">200</td>
                    <td th:text="${a.durationMs}">12</td>
                    <td class="mono" th:text="${a.signatureTimestamp}">0</td>
                    <td th:text="${a.errorReason != null ? a.errorReason : (a.responseExcerpt != null ? a.responseExcerpt : 'OK')}">OK</td>
                    <td class="mono" th:text="${a.attemptedAt}">ts</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
