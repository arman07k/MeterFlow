<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — MeterFlow</title>
</head>
<body>
<main>
    <h1>Sign In to MeterFlow</h1>
    <div th:if="${param.error}">Invalid username or password.</div>
    <div th:if="${param.logout}">You have been signed out.</div>
    <form th:action="@{/login}" method="post">
        <div>
            <label for="username">Email</label>
            <input id="username" name="username" type="email" required autocomplete="username">
        </div>
        <div>
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required autocomplete="current-password">
        </div>
        <button type="submit">Sign In</button>
    </form>
</main>
</body>
</html>
