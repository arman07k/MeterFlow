<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Sign In')}"></head>
<body>
<header class="topbar">
    <a class="topbar-brand" th:href="@{/}">MeterFlow</a>
    <nav class="topbar-nav">
        <a th:href="@{/}">Home</a>
    </nav>
</header>
<main class="container-narrow">
    <div class="card">
        <h1>Sign in to MeterFlow</h1>
        <p class="subtitle">Authenticate with your MeterFlow platform or customer portal account.</p>

        <div th:if="${param.error}" class="alert alert-error">Invalid email or password.</div>
        <div th:if="${param.logout}" class="alert alert-success">You have been signed out securely.</div>

        <form th:action="@{/login}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="form-field">
                <label for="username">Email</label>
                <input id="username" name="username" type="email" autocomplete="username" required/>
            </div>
            <div class="form-field">
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required/>
            </div>
            <p><button type="submit" class="btn">Sign In</button></p>
        </form>
    </div>
</main>
</body>
</html>
