<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Subscription Operations')}"></head>
<body>
<header th:replace="~{fragments/layout :: operatorNav('subscriptions')}"></header>
<main class="container">
    <div th:replace="~{fragments/layout :: flashMessages}"></div>
    <div class="page-header">
        <div>
            <h1>Subscription Operations</h1>
            <p class="subtitle">Filter active, trialing, paused, past-due, and suspended subscriptions.</p>
        </div>
        <form th:action="@{/operator/subscriptions}" method="get" class="actions-row">
            <select name="status">
                <option value="">All Statuses</option>
                <option th:each="st : ${statuses}" th:value="${st}" th:text="${st}"
                        th:selected="${selectedStatus != null and selectedStatus == st}"></option>
            </select>
            <button type="submit" class="btn btn-secondary">Filter</button>
        </form>
    </div>

    <div class="card">
        <div th:if="${subscriptionsPage.isEmpty()}" class="empty-state">No subscriptions found.</div>
        <div th:unless="${subscriptionsPage.isEmpty()}" class="table-wrap">
            <table>
                <thead><tr><th>Subscription ID</th><th>Customer</th><th>Status</th><th>Currency</th><th>Seats</th><th>Period End</th><th>Actions</th></tr></thead>
                <tbody>
                <tr th:each="s : ${subscriptionsPage.content}">
                    <td class="mono" th:text="${s.id}">id</td>
                    <td><a class="mono" th:href="@{/operator/customers/{id}(id=${s.customerId})}" th:text="${s.customerId}">cust</a></td>
                    <td><span class="badge badge-info" th:text="${s.status}">ACTIVE</span></td>
                    <td th:text="${s.currency}">BDT</td>
                    <td th:text="${s.seatQuantity}">1</td>
                    <td class="mono" th:text="${s.currentPeriodEnd}">ts</td>
                    <td>
                        <div class="actions-row">
                            <form th:if="${s.status.name() == 'ACTIVE'}" th:action="@{/operator/subscriptions/{id}/pause(id=${s.id})}" method="post" class="inline-form">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-secondary btn-sm">Pause</button>
                            </form>
                            <form th:if="${s.status.name() == 'PAUSED'}" th:action="@{/operator/subscriptions/{id}/resume(id=${s.id})}" method="post" class="inline-form">
                                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                <button type="submit" class="btn btn-sm">Resume</button>
                            </form>
                        </div>
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="pagination" th:if="${subscriptionsPage.totalPages > 1}">
                <span th:text="'Page ' + (${subscriptionsPage.number} + 1) + ' of ' + ${subscriptionsPage.totalPages} + ' (' + ${subscriptionsPage.totalElements} + ' total)'"></span>
                <div class="actions-row">
                    <a th:if="${subscriptionsPage.hasPrevious()}" class="btn btn-secondary btn-sm"
                       th:href="@{/operator/subscriptions(status=${selectedStatus},page=${subscriptionsPage.number - 1})}">Previous</a>
                    <a th:if="${subscriptionsPage.hasNext()}" class="btn btn-secondary btn-sm"
                       th:href="@{/operator/subscriptions(status=${selectedStatus},page=${subscriptionsPage.number + 1})}">Next</a>
                </div>
            </div>
        </div>
    </div>
</main>
</body>
</html>
